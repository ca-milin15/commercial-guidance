<div class="layout">
  <aside class="sidebar">
    <div class="brand">Commercial Guidance</div>
    <nav class="menu">
      @for (option of menuOptions; track option.route) {
        <a
          class="menu-item"
          [routerLink]="option.route"
          routerLinkActive="active"
        >
          <span class="icon">{{ option.icon }}</span>
          <span class="label">{{ option.label }}</span>
        </a>
      }
    </nav>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
